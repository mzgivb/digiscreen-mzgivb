<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <!-- 1mm Raster (10px) -->
    <pattern id="mm1" width="10" height="10" patternUnits="userSpaceOnUse">
      <line x1="10" y1="0" x2="10" y2="10" stroke="#c8d8c8" stroke-width="0.3"/>
      <line x1="0" y1="10" x2="10" y2="10" stroke="#c8d8c8" stroke-width="0.3"/>
    </pattern>
    <!-- 5mm Raster (50px) -->
    <pattern id="mm5" width="50" height="50" patternUnits="userSpaceOnUse">
      <line x1="50" y1="0" x2="50" y2="50" stroke="#a0bfa0" stroke-width="0.5"/>
      <line x1="0" y1="50" x2="50" y2="50" stroke="#a0bfa0" stroke-width="0.5"/>
    </pattern>
    <!-- 10mm Raster (100px) -->
    <pattern id="mm10" width="100" height="100" patternUnits="userSpaceOnUse">
      <line x1="100" y1="0" x2="100" y2="100" stroke="#78a878" stroke-width="0.8"/>
      <line x1="0" y1="100" x2="100" y2="100" stroke="#78a878" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#mm1)"/>
  <rect width="1920" height="1080" fill="url(#mm5)"/>
  <rect width="1920" height="1080" fill="url(#mm10)"/>
</svg>
